<a
  class="list-group-item clearfix"
  [routerLink]="[contact.id]"
  routerLinkActive="active">
  <div class="pull-left">
    <h4 class="list-group-item-heading">{{ contact.name }}</h4>
  </div>

  <div class="pull-right">
    <img
      [src]="imagePath"
      (error)="useFallbackImage($event)"
      style="height:50px;"
      alt="{{ contact.name }}"
    />
  </div>
</a>
