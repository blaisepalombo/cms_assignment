<a
  class="list-group-item clearfix"
  [routerLink]="[contact.id]"
  routerLinkActive="active">
  <div class="pull-left">
    <h4 class="list-group-item-heading">{{ contact.name }}</h4>
  </div>

  <div class="pull-right">
    <img
      [src]="contact.imageUrl"
      style="height:50px;"
    />
  </div>
</a>
